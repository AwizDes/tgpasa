<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Telegram Dice Controller</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-container {
            background: #1a1a1a;
            padding: 2.5rem;
            border-radius: 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
            width: 100%;
            max-width: 400px;
            border: 1px solid #333;
        }
        
        h1 {
            color: #fff;
            margin-bottom: 0.5rem;
            font-size: 1.75rem;
            text-align: center;
            font-weight: normal;
            letter-spacing: 1px;
        }
        
        .subtitle {
            color: #888;
            margin-bottom: 2rem;
            text-align: center;
            font-size: 0.9rem;
            font-family: monospace;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #aaa;
            font-weight: normal;
            font-family: monospace;
        }
        
        input[type="password"] {
            width: 100%;
            padding: 0.75rem;
            background: #0a0a0a;
            border: 1px solid #444;
            border-radius: 0;
            font-size: 1rem;
            transition: border-color 0.3s;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
        }
        
        input[type="password"]:focus {
            outline: none;
            border-color: #888;
        }
        
        .btn {
            width: 100%;
            padding: 0.875rem;
            background: #222;
            color: #e0e0e0;
            border: 1px solid #555;
            border-radius: 0;
            font-size: 1rem;
            font-weight: normal;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
        }
        
        .btn:hover {
            background: #2a2a2a;
            border-color: #666;
        }
        
        .btn:active {
            background: #1a1a1a;
        }
        
        .error {
            background: #1a1a1a;
            color: #a44;
            padding: 0.75rem;
            border-radius: 0;
            margin-bottom: 1rem;
            border-left: 3px solid #a44;
            border-top: 1px solid #333;
            border-right: 1px solid #333;
            border-bottom: 1px solid #333;
            font-size: 0.9rem;
            font-family: 'Courier New', monospace;
        }
        
        .lock-icon {
            text-align: center;
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="lock-icon">ꗃ</div>
        <h1>Access Required</h1>
        <p class="subtitle">Telegram Dice Controller</p>
        
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        
        <form method="POST" action="/auth">
            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Enter your password"
                    required
                    autofocus
                >
            </div>
            <button type="submit" class="btn">Login</button>
        </form>
    </div>
</body>
</html>
